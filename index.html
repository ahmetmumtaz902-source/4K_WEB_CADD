<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, minimum-scale=1, maximum-scale=1">
    <title>Profesyonel 2D CAD</title>
    <link rel="stylesheet" type="text/css" href="theme/love.css">
  </head>
  <body>
    <center>
      <div>
        <h1>Profesyonel 2D CAD</h1>
        <canvas id="loadingCanvas" oncontextmenu="event.preventDefault()" width="800" height="600"></canvas>
        <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
      </div>
    </center>

    <script type='text/javascript'>
      function goFullScreen(){
            var canvas = document.getElementById("canvas");
            if(canvas.requestFullScreen) canvas.requestFullScreen();
            else if(canvas.webkitRequestFullScreen) canvas.webkitRequestFullScreen();
            else if(canvas.mozRequestFullScreen) canvas.mozRequestFullScreen();
      }
      function FullScreenHook(){
        var canvas = document.getElementById("canvas");
        canvas.width = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;
        canvas.height = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight;
      }
      var loadingContext = document.getElementById('loadingCanvas').getContext('2d');
      function drawLoadingText(text) {
        var canvas = loadingContext.canvas;
        loadingContext.fillStyle = "rgb(142, 195, 227)";
        loadingContext.fillRect(0, 0, canvas.scrollWidth, canvas.scrollHeight);
        loadingContext.font = '2em arial';
        loadingContext.textAlign = 'center';
        loadingContext.fillStyle = "rgb( 11, 86, 117 )";
        loadingContext.fillText(text, canvas.scrollWidth / 2, canvas.scrollHeight / 2);
      }

      window.onload = function () { window.focus(); };
      window.onclick = function () { window.focus(); };

      window.addEventListener("keydown", function(e) {
        if([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) e.preventDefault();
      }, false);

      var Module = {
        arguments: ["./game.love"],
        INITIAL_MEMORY: 67108864,
        printErr: console.error.bind(console),
        canvas: (function() {
          var canvas = document.getElementById('canvas');
          canvas.addEventListener("webglcontextlost", function(e) { alert('WebGL context lost. Reload needed.'); e.preventDefault(); }, false);
          return canvas;
        })(),
        setStatus: function(text) {
          if (text) drawLoadingText(text);
          else if (Module.remainingDependencies === 0) {
            document.getElementById('loadingCanvas').style.display = 'none';
            document.getElementById('canvas').style.visibility = 'visible';
          }
        },
        totalDependencies: 0, remainingDependencies: 0,
        monitorRunDependencies: function(left) {
          this.remainingDependencies = left;
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left ? 'Preparing...' : 'All downloads complete.');
        }
      };
      
      var applicationLoad = function(e) { Love(Module); }

      // 🚀 MUTLAK TARAYICI İNDİRME VE SÜRÜKLEME KİLİTLEME MOTORU
      // Hem boşluklara hem de doğrudan siyah çizim ekranına (canvas) kilit vurur!
      var kilitlenecekler = [window, document, document.getElementById('canvas')];
      kilitlenecekler.forEach(function(hedef) {
          if (hedef) {
              hedef.addEventListener("dragenter", function(e) { e.preventDefault(); e.stopPropagation(); }, false);
              hedef.addEventListener("dragover", function(e) { e.preventDefault(); e.stopPropagation(); }, false);
              hedef.addEventListener("dragleave", function(e) { e.preventDefault(); e.stopPropagation(); }, false);
              hedef.addEventListener("drop", function(e) { e.preventDefault(); e.stopPropagation(); }, false);
          }
      });

      // 🚀 EM-SCRIPTEN SANAL DISK SENKRONİZASYONU
      document.body.addEventListener("drop", function(e) {
          e.preventDefault();
          var files = e.dataTransfer.files;
          if (files && files.length > 0) {
              var file = files[0]; // İlk dosyayı güvenli şekilde yakala
              var reader = new FileReader();
              
              reader.onload = function(event) {
                  var icerik = event.target.result;
                  if (Module && Module.FS) {
                      var dosyaAdi = file.name.toLowerCase();
                      
                      -- LÖVE2D web motorunun tam ve izole savePath yolunu kilitliyoruz
                      var savePath = "/home/web_user/.local/share/love/Profesyonel 2D CAD/";
                      try { Module.FS.mkdirTree(savePath); } catch(err) {}
                      
                      if (dosyaAdi.endsWith(".json")) {
                          Module.FS.writeFile(savePath + "cad_proje_kayit.json", icerik);
                          alert("JSON Projesi Başarıyla Yüklendi! Görmek için LOAD JSON butonuna tıklayın.");
                      } else if (dosyaAdi.endsWith(".dxf")) {
                          Module.FS.writeFile(savePath + "suruklenen.dxf", icerik);
                          alert("DXF Çizimi Başarıyla Yüklendi! Görmek için IMPORT DXF butonuna tıklayın.");
                      }
                  }
              };
              reader.readAsText(file);
          }
      }, true); // True bayrağı ile tarayıcının tüm indirme önceliklerini eziyoruz

      // 🚀 SAF RAW BINARY EXPORT İNDİRME FONKSİYONU
      function tarayiciyaIndirt(dosyaAdi, icerik, mimeType) {
          var savePath = "/home/web_user/.local/share/love/Profesyonel 2D CAD/" + dosyaAdi;
          try {
              var veri = Module.FS.readFile(savePath);
              var blob = new Blob([veri], {type: mimeType || "application/octet-stream"});
              var url = URL.createObjectURL(blob);
              var a = document.createElement("a");
              a.href = url;
              a.download = dosyaAdi;
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
          } catch(e) {
              console.log("Dosya yerel sanal diske yazildi.");
          }
      }
    </script>
    <script type="text/javascript" src="game.js"></script>
    <script async type="text/javascript" src="love.js" onload="applicationLoad(this)"></script>
    <footer>
      <p>Built with love.js <button onclick="goFullScreen();">Go Fullscreen</button></p>
    </footer>
  </body>
</html>
